# One pull request per week and kind, against the branch on which the work happens.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /hub
    target-branch: experimental
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      # 11.x requires net10.0; the hub targets net8.0
      - dependency-name: System.Data.OleDb
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: experimental
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
