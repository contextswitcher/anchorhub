# One pull request per week and kind, against the branch on which the work happens.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /hub
    target-branch: experimental
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: experimental
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
